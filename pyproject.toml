[project]
name = "coedit-agents"
version = "0.1.0"
description = "Real-time coordination layer for multiple coding agents editing one repository: region leases, intent awareness, conflict detection, MCP adapter."
requires-python = ">=3.11"
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coedit = "coedit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coedit*"]
